# NOTE: GitHub blocks integrations without the 'workflow' scope from
# writing into .github/workflows/. Move this file there via the GitHub web
# UI (open it, click the pencil, change the path to .github/workflows/ci.yml,
# commit). CI activates the moment it lands there.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run core unit tests
        run: swift test

  build:
    name: Build app
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: |
          xcodebuild \
            -project ChequebookTao.xcodeproj \
            -scheme ChequebookTao \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Ad-hoc sign and zip
        run: |
          APP="build/Build/Products/Release/ChequebookTao.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "ChequebookTao.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChequebookTao
          path: ChequebookTao.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ChequebookTao.zip \
            --title "Chequebook Tao ${GITHUB_REF_NAME}" \
            --notes "Unzip, then right-click the app and choose Open the first time (the build is unsigned)." \
            --repo "${GITHUB_REPOSITORY}"
